youtube:
  base_url: "https://www.youtube.com"
  max_results_per_serp: 40
  searches_per_session_max: 15
  subscriber_enrichment_limit: 40
llm:
  provider: "openai"
  model: "gpt-4o"
  api_key_env: "OPENAI_API_KEY"
  # Gemini: provider "gemini", model "gemini-2.5-flash-lite", env "GEMINI_API_KEY"
  # OpenRouter: provider "openrouter", model "anthropic/claude-sonnet-4",
  # env "OPENROUTER_API_KEY", base_url "https://openrouter.ai/api/v1"
  temperature: 0.4
  max_tokens: 3000
browser:
  headed: false
  headless: true
  locale: "en-US"
  timezone: "America/New_York"
  extension_dirs: ["./extensions/vidiq"]
  user_data_dir: "./browser_profiles"
vidiq:
  required: true
  timeout_seconds: 20
research:
  low_rpm_share: 60
  high_rpm_share: 40
  audience_regions: "US,CA"
  mobile_only: true
  max_video_minutes: 5
  max_suggestions_per_keyword: 6
  min_wait_between_keywords_seconds: 30
  max_wait_between_keywords_seconds: 120
  min_reading_time_seconds: 15
  max_reading_time_seconds: 45
  cooldown_minutes: 5
  cooldown_max_minutes: 15
  max_recursion_depth: 3
  workers: auto          # parallel Chrome workers: auto (resource-tuned) or a number
  workers_headless: true
  # Fraction of total RAM permanently reserved for your other applications.
  # The fleet is sized only from the RAM left after this headroom (0.0-0.95,
  # default 0.40 = keep at least 40% of RAM free). Raise it when you run many
  # heavy apps alongside research; lower it to let more workers run.
  workers_ram_headroom: 0.40
  apps:
    # Extra apps allowed beyond the built-in catalog. Aurora only researches
    # lightweight Windows apps (~3GB), AI tools, VALORANT game fixes, or already
    # installed/trivially downloadable software — add any extra names here.
    include: []
    # Extra software to never research (in addition to the built-in blocklist:
    # GTA, Adobe, Rocket League, Vegas, Fortnite, ...).
    exclude: []
scoring:
  goldmine_threshold_low_rpm: 60
  goldmine_threshold_high_rpm: 50
  goldmine_threshold_fix: 50
database:
  url: "sqlite:///aurora.db"
output:
  directory: "./reports"
