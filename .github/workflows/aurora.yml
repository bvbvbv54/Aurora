name: Aurora supervised research
on:
  workflow_dispatch:
    inputs:
      command:
        description: Aurora command
        required: true
        default: report
        type: choice
        options: [report, run-once]

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[browser,llm]"
      - name: Install browser display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb fonts-liberation fonts-noto-core
      - name: Run Aurora
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" aurora "${{ inputs.command }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

